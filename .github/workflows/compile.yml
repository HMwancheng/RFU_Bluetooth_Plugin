name: Compile RFU Bluetooth Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022  # 明确指定Windows版本，避免迁移问题
    # 替代windows-latest，避免未来自动迁移到Server 2025可能的兼容问题

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install CMake
      uses: lukka/get-cmake@v3  # 使用最新的v3版本（替代不存在的v3.27）
      # 该版本会自动获取最新的CMake稳定版

    - name: Set up Visual Studio environment
      uses: microsoft/setup-msbuild@v1.3.1

    - name: Create build directory
      run: |
        mkdir build
        cd build

    - name: Configure CMake
      run: |
        cd build
        cmake -G "Visual Studio 17 2022" -A x64 ..

    - name: Build project
      run: |
        cd build
        cmake --build . --config Release

    - name: Upload compiled DLL
      uses: actions/upload-artifact@v4  # 升级到最新的v4版本（解决弃用问题）
      with:
        name: RFU_Bluetooth_Plugin
        path: build/Release/RFU_Bluetooth_Plugin.dll
